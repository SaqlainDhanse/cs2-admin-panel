<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/vite.svg" />
		<meta name="generator" content="UGC CS2 Dashboard" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>UGC CS2 Dashboard</title>
		<script type="module">
			import { activeBrand } from '/src/themes/index.js';
			document.title = activeBrand.appName;
			document.querySelector('meta[name="generator"]')?.setAttribute('content', activeBrand.appName);
			if (activeBrand.logo?.src) {
				const icon = document.querySelector('link[rel="icon"]');
				if (icon) icon.href = activeBrand.logo.src;
			}
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.jsx"></script>
	</body>
</html>
