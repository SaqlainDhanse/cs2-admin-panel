name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install
          npm install --prefix apps/web
          npm install --prefix apps/api

      - name: Build React frontend
        run: npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy to VPS
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          VPS_IP: ${{ secrets.VPS_IP }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # Create deployment directory if it doesn't exist
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key ${SSH_USER}@${VPS_IP} "mkdir -p ${DEPLOY_PATH}/apps/web ${DEPLOY_PATH}/apps/api"
          
          # Copy built frontend files
          scp -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key -r dist/apps/web/* ${SSH_USER}@${VPS_IP}:${DEPLOY_PATH}/apps/web/
          
          # Copy API files
          scp -i ~/.ssh/deploy_key -r apps/api/* ${SSH_USER}@${VPS_IP}:${DEPLOY_PATH}/apps/api/
          scp -i ~/.ssh/deploy_key apps/api/package.json ${SSH_USER}@${VPS_IP}:${DEPLOY_PATH}/apps/api/
          
          # Copy ecosystem config
          scp -i ~/.ssh/deploy_key ecosystem.config.js ${SSH_USER}@${VPS_IP}:${DEPLOY_PATH}/
          
          # Install dependencies on VPS and restart services
          ssh -i ~/.ssh/deploy_key ${SSH_USER}@${VPS_IP} "cd ${DEPLOY_PATH} && npm install --prefix apps/api && pm2 restart ecosystem.config.js || pm2 start ecosystem.config.js && pm2 save"
