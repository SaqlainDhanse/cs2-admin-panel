name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy to VPS
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          VPS_IP: ${{ secrets.VPS_IP }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |

          # Pull latest code and build on VPS
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key ${SSH_USER}@${VPS_IP} "cd ${DEPLOY_PATH} && git pull origin main && npm install && npm install --prefix apps/web && npm install --prefix apps/api && npm run build && pm2 restart ecosystem.config.js || pm2 start ecosystem.config.js && pm2 save"